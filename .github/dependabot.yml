version: 2

# Weekly update PRs. Minor and patch bumps come grouped into one PR per ecosystem;
# a major bump gets a PR of its own, since it may need changes here.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
